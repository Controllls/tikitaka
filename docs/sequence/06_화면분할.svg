<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1168" role="img" aria-label="06 · 차량 + 이동 기록 + 내비게이션">
<title>06 · 차량 + 이동 기록 + 내비게이션</title>
<defs><marker id="06-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#ffb86b" stroke-width="1.7"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif}.seq-life{stroke:#42566e;stroke-dasharray:6 7;stroke-width:1.4}.seq-arrow{fill:none;stroke:#ffb86b;stroke-width:2}</style>
<rect width="1200" height="1168" rx="16" fill="#101925"/>
<text x="28" y="36" text-anchor="start" fill="#ffb86b" font-size="22">06 · 차량 + 이동 기록 + 내비게이션</text>
<line x1="120" y1="134" x2="120" y2="1146" class="seq-life"/>
<rect x="12" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="120" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">사용자</text>
<line x1="360" y1="134" x2="360" y2="1146" class="seq-life"/>
<rect x="252" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="360" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">Pleos</text>
<text x="360" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">창 관리자</text>
<line x1="600" y1="134" x2="600" y2="1146" class="seq-life"/>
<rect x="492" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="600" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">이동 기록</text>
<text x="600" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">Activity / Layout</text>
<line x1="840" y1="134" x2="840" y2="1146" class="seq-life"/>
<rect x="732" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="840" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">앱 상태</text>
<text x="840" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">Coordinator / Store</text>
<line x1="1080" y1="134" x2="1080" y2="1146" class="seq-life"/>
<rect x="972" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="1080" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">진행 중 녹음</text>
<text x="1080" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">RecordingService</text>
<text x="240.0" y="186" text-anchor="middle" fill="#edf2f8" font-size="17">1. 앱 창을 좁은 모드로</text>
<text x="240.0" y="210" text-anchor="middle" fill="#edf2f8" font-size="17">전환</text>
<line x1="120" y1="224" x2="360" y2="224" class="seq-arrow" marker-end="url(#06-arrow)"/>
<text x="480.0" y="286" text-anchor="middle" fill="#edf2f8" font-size="17">2. 창 크기</text>
<text x="480.0" y="310" text-anchor="middle" fill="#edf2f8" font-size="17">변경·Activity 재생성</text>
<line x1="360" y1="324" x2="600" y2="324" class="seq-arrow" marker-end="url(#06-arrow)"/>
<path d="M600,376 h48 v48 h-48" class="seq-arrow" marker-end="url(#06-arrow)"/>
<text x="664" y="390" text-anchor="start" fill="#edf2f8" font-size="17">3. 현재 창 폭에 맞는 리소스 선택</text>
<rect x="26" y="454" width="1148" height="78" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="483" text-anchor="middle" fill="#c8d8e8" font-size="17">900dp 미만: 세로 배치·하단 보조 문구 숨김. 900dp 이상: 가로 배치·보조 문구 표시. XML visibility의 gone 값은 2이며 코드</text>
<text x="600.0" y="507" text-anchor="middle" fill="#c8d8e8" font-size="17">상수 View.GONE=8과 다릅니다.</text>
<text x="720.0" y="582" text-anchor="middle" fill="#edf2f8" font-size="17">4. 상태 관찰</text>
<text x="720.0" y="606" text-anchor="middle" fill="#edf2f8" font-size="17">재등록·탑승 안내 복원</text>
<line x1="600" y1="620" x2="840" y2="620" class="seq-arrow" marker-end="url(#06-arrow)"/>
<text x="720.0" y="682" text-anchor="middle" fill="#edf2f8" font-size="17">5. 현재 탑승·녹음 상태</text>
<text x="720.0" y="706" text-anchor="middle" fill="#edf2f8" font-size="17">반영</text>
<line x1="840" y1="720" x2="600" y2="720" class="seq-arrow" marker-end="url(#06-arrow)" stroke-dasharray="6 5"/>
<text x="960.0" y="782" text-anchor="middle" fill="#edf2f8" font-size="17">6. 이미 시작한 녹음의</text>
<text x="960.0" y="806" text-anchor="middle" fill="#edf2f8" font-size="17">시간·입력 크기 전달</text>
<line x1="1080" y1="820" x2="840" y2="820" class="seq-arrow" marker-end="url(#06-arrow)" stroke-dasharray="6 5"/>
<rect x="26" y="862" width="1148" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="891" text-anchor="middle" fill="#c8d8e8" font-size="17">서비스가 이미 녹음 중인 경우의 상태 전달입니다. 화면 분할이나 Activity 재생성이 새 녹음을 시작하지 않습니다.</text>
<text x="240.0" y="966" text-anchor="middle" fill="#edf2f8" font-size="17">7. 차량 화면 + 이동</text>
<text x="240.0" y="990" text-anchor="middle" fill="#edf2f8" font-size="17">기록 + 내비 동시 표시</text>
<line x1="360" y1="1004" x2="120" y2="1004" class="seq-arrow" marker-end="url(#06-arrow)" stroke-dasharray="6 5"/>
<rect x="26" y="1046" width="1148" height="78" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="1075" text-anchor="middle" fill="#c8d8e8" font-size="17">기기 테스트: 841·899·900·1682dp에서 홈·녹음 목록 레이아웃 생성 확인. 에뮬레이터에서 1682→841dp 전환 후 앱 프로세스 유지와</text>
<text x="600.0" y="1099" text-anchor="middle" fill="#c8d8e8" font-size="17">3분할 표시 확인.</text>
</svg>