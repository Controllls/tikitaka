<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2202" role="img" aria-label="02 · 탑승 안내 → 명시적 녹음 → 저장">
<title>02 · 탑승 안내 → 명시적 녹음 → 저장</title>
<defs><marker id="02-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#ffb86b" stroke-width="1.7"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif}.seq-life{stroke:#42566e;stroke-dasharray:6 7;stroke-width:1.4}.seq-arrow{fill:none;stroke:#ffb86b;stroke-width:2}</style>
<rect width="1680" height="2202" rx="16" fill="#101925"/>
<text x="28" y="36" text-anchor="start" fill="#ffb86b" font-size="22">02 · 탑승 안내 → 명시적 녹음 → 저장</text>
<line x1="120" y1="134" x2="120" y2="2180" class="seq-life"/>
<rect x="12" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="120" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">사용자</text>
<line x1="360" y1="134" x2="360" y2="2180" class="seq-life"/>
<rect x="252" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="360" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">좌석 신호</text>
<text x="360" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">Vehicle SDK</text>
<line x1="600" y1="134" x2="600" y2="2180" class="seq-life"/>
<rect x="492" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="600" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">탑승 상태</text>
<text x="600" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">Monitor / Coordinator</text>
<line x1="840" y1="134" x2="840" y2="2180" class="seq-life"/>
<rect x="732" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="840" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">대기 서비스</text>
<text x="840" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">시스템 알림</text>
<line x1="1080" y1="134" x2="1080" y2="2180" class="seq-life"/>
<rect x="972" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="1080" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">앱 화면</text>
<text x="1080" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">MainActivity</text>
<line x1="1320" y1="134" x2="1320" y2="2180" class="seq-life"/>
<rect x="1212" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="1320" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">녹음 서비스</text>
<text x="1320" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">RecordingService</text>
<line x1="1560" y1="134" x2="1560" y2="2180" class="seq-life"/>
<rect x="1452" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="1560" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">기기 저장소</text>
<text x="1560" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">RecordingFiles</text>
<text x="480.0" y="186" text-anchor="middle" fill="#edf2f8" font-size="17">1. 운전석 점유 값 전달</text>
<line x1="360" y1="200" x2="600" y2="200" class="seq-arrow" marker-end="url(#02-arrow)"/>
<path d="M600,252 h48 v48 h-48" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="664" y="266" text-anchor="start" fill="#edf2f8" font-size="17">2. 1.2초 안정화·중복 탑승 확인</text>
<rect x="26" y="330" width="1628" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="840.0" y="359" text-anchor="middle" fill="#c8d8e8" font-size="17">화면 밖 + 안내 켜짐 + 대기 실행 + 좌석 연결 정상 + 점유 + 응답 대기 + 녹음 중 아님을 모두 만족할 때 알림을 등록합니다.</text>
<text x="720.0" y="434" text-anchor="middle" fill="#edf2f8" font-size="17">3. 이번 이동을</text>
<text x="720.0" y="458" text-anchor="middle" fill="#edf2f8" font-size="17">기록할까요? 알림 등록</text>
<line x1="600" y1="472" x2="840" y2="472" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="480.0" y="534" text-anchor="middle" fill="#edf2f8" font-size="17">4. 알림창을 열고 탑승 알림 선택</text>
<line x1="120" y1="548" x2="840" y2="548" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="960.0" y="610" text-anchor="middle" fill="#edf2f8" font-size="17">5. PendingIntent로 앱</text>
<text x="960.0" y="634" text-anchor="middle" fill="#edf2f8" font-size="17">열기</text>
<line x1="840" y1="648" x2="1080" y2="648" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="840.0" y="710" text-anchor="middle" fill="#edf2f8" font-size="17">6. 화면 표시 상태 전달</text>
<line x1="1080" y1="724" x2="600" y2="724" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="720.0" y="786" text-anchor="middle" fill="#edf2f8" font-size="17">7. 탑승 알림 정리</text>
<line x1="600" y1="800" x2="840" y2="800" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="600.0" y="862" text-anchor="middle" fill="#edf2f8" font-size="17">8. 녹음 카드 안내·두 번 강조</text>
<line x1="1080" y1="876" x2="120" y2="876" class="seq-arrow" marker-end="url(#02-arrow)" stroke-dasharray="6 5"/>
<rect x="26" y="918" width="1628" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="840.0" y="947" text-anchor="middle" fill="#c8d8e8" font-size="17">이미 앱이 보이는 경우에는 알림창 진입 없이 같은 녹음 카드를 안내합니다. 별도 앱 동의 팝업 대신 카드에 녹음 안내를 표시합니다.</text>
<text x="600.0" y="1022" text-anchor="middle" fill="#edf2f8" font-size="17">9. 동승자 동의 확인 후 녹음 버튼 선택</text>
<line x1="120" y1="1036" x2="1080" y2="1036" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="840.0" y="1098" text-anchor="middle" fill="#edf2f8" font-size="17">10. 현재 탑승 응답 완료 저장</text>
<line x1="1080" y1="1112" x2="600" y2="1112" class="seq-arrow" marker-end="url(#02-arrow)"/>
<path d="M1080,1164 h48 v48 h-48" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="1144" y="1178" text-anchor="start" fill="#edf2f8" font-size="17">11. 마이크 권한 확인·필요 시 요청</text>
<rect x="26" y="1242" width="1628" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="840.0" y="1271" text-anchor="middle" fill="#c8d8e8" font-size="17">마이크 거절 시 시작하지 않습니다. 알림 권한 요청을 거친 뒤에도 화면이 다시 활성화된 상태에서만 녹음을 시작합니다.</text>
<text x="1200.0" y="1346" text-anchor="middle" fill="#edf2f8" font-size="17">12. 명시적 시작 요청</text>
<line x1="1080" y1="1360" x2="1320" y2="1360" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="1080.0" y="1422" text-anchor="middle" fill="#edf2f8" font-size="17">13. microphone 포그라운드 알림·종료 버튼</text>
<line x1="1320" y1="1436" x2="840" y2="1436" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="1440.0" y="1498" text-anchor="middle" fill="#edf2f8" font-size="17">14. AAC 음성을 임시</text>
<text x="1440.0" y="1522" text-anchor="middle" fill="#edf2f8" font-size="17">.pending 파일에 기록</text>
<line x1="1320" y1="1536" x2="1560" y2="1536" class="seq-arrow" marker-end="url(#02-arrow)"/>
<rect x="26" y="1578" width="1628" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="840.0" y="1607" text-anchor="middle" fill="#c8d8e8" font-size="17">시작한 녹음은 내비 전환·화면 재생성 중에도 서비스에서 유지됩니다. 좌석을 비우는 것만으로 자동 종료하지 않습니다.</text>
<text x="600.0" y="1682" text-anchor="middle" fill="#edf2f8" font-size="17">15. 녹음 종료 선택</text>
<line x1="120" y1="1696" x2="1080" y2="1696" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="1200.0" y="1758" text-anchor="middle" fill="#edf2f8" font-size="17">16. 종료 요청</text>
<line x1="1080" y1="1772" x2="1320" y2="1772" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="1440.0" y="1834" text-anchor="middle" fill="#edf2f8" font-size="17">17. stop → 길이·파일</text>
<text x="1440.0" y="1858" text-anchor="middle" fill="#edf2f8" font-size="17">확인 → .m4a 확정</text>
<line x1="1320" y1="1872" x2="1560" y2="1872" class="seq-arrow" marker-end="url(#02-arrow)"/>
<path d="M1320,1924 h-48 v48 h48" class="seq-arrow" marker-end="url(#02-arrow)"/>
<text x="1256" y="1938" text-anchor="end" fill="#edf2f8" font-size="17">18. MediaRecorder.release로 마이크</text>
<text x="1256" y="1962" text-anchor="end" fill="#edf2f8" font-size="17">해제</text>
<text x="1200.0" y="2024" text-anchor="middle" fill="#edf2f8" font-size="17">19. 최종 상태 발행·기록</text>
<text x="1200.0" y="2048" text-anchor="middle" fill="#edf2f8" font-size="17">목록 갱신</text>
<line x1="1320" y1="2062" x2="1080" y2="2062" class="seq-arrow" marker-end="url(#02-arrow)" stroke-dasharray="6 5"/>
<rect x="26" y="2104" width="1628" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="840.0" y="2133" text-anchor="middle" fill="#c8d8e8" font-size="17">알림의 종료 버튼도 서비스에 직접 종료를 요청합니다. 너무 짧거나 저장에 실패한 미완성 파일은 정리하고 오류를 알립니다. 녹음은 자동 재시작하지 않습니다.</text>
</svg>