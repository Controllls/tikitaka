<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1334" role="img" aria-label="04 · 녹음 종료 후 Gleo 듣기 요청">
<title>04 · 녹음 종료 후 Gleo 듣기 요청</title>
<defs><marker id="04-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#ffb86b" stroke-width="1.7"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif}.seq-life{stroke:#42566e;stroke-dasharray:6 7;stroke-width:1.4}.seq-arrow{fill:none;stroke:#ffb86b;stroke-width:2}</style>
<rect width="1200" height="1334" rx="16" fill="#101925"/>
<text x="28" y="36" text-anchor="start" fill="#ffb86b" font-size="22">04 · 녹음 종료 후 Gleo 듣기 요청</text>
<line x1="120" y1="134" x2="120" y2="1312" class="seq-life"/>
<rect x="12" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="120" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">사용자</text>
<line x1="360" y1="134" x2="360" y2="1312" class="seq-life"/>
<rect x="252" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="360" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">녹음 화면</text>
<text x="360" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">MainActivity</text>
<line x1="600" y1="134" x2="600" y2="1312" class="seq-life"/>
<rect x="492" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="600" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">녹음 서비스</text>
<text x="600" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">RecordingService</text>
<line x1="840" y1="134" x2="840" y2="1312" class="seq-life"/>
<rect x="732" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="840" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">기기 저장소</text>
<line x1="1080" y1="134" x2="1080" y2="1312" class="seq-life"/>
<rect x="972" y="60" width="216" height="74" rx="12" fill="#233247" stroke="#4b627c"/>
<text x="1080" y="92" text-anchor="middle" fill="#edf2f8" font-size="17">Gleo</text>
<text x="1080" y="115" text-anchor="middle" fill="#edf2f8" font-size="13">ai.umos.ambientai</text>
<text x="240.0" y="186" text-anchor="middle" fill="#edf2f8" font-size="17">1. Gleo 사용하기 선택</text>
<line x1="120" y1="200" x2="360" y2="200" class="seq-arrow" marker-end="url(#04-arrow)"/>
<path d="M360,252 h48 v48 h-48" class="seq-arrow" marker-end="url(#04-arrow)"/>
<text x="424" y="266" text-anchor="start" fill="#edf2f8" font-size="17">2. 화면 활성·Gleo 설치 여부·중복 요청</text>
<text x="424" y="290" text-anchor="start" fill="#edf2f8" font-size="17">확인</text>
<rect x="26" y="332" width="1148" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="361" text-anchor="middle" fill="#c8d8e8" font-size="17">녹음 중인 경우 아래 저장 단계를 수행합니다. 시작·저장 중에는 요청을 받지 않습니다.</text>
<text x="480.0" y="436" text-anchor="middle" fill="#edf2f8" font-size="17">3. 녹음 종료 요청</text>
<line x1="360" y1="450" x2="600" y2="450" class="seq-arrow" marker-end="url(#04-arrow)"/>
<text x="720.0" y="512" text-anchor="middle" fill="#edf2f8" font-size="17">4. 녹음을 종료하고 M4A</text>
<text x="720.0" y="536" text-anchor="middle" fill="#edf2f8" font-size="17">확정</text>
<line x1="600" y1="550" x2="840" y2="550" class="seq-arrow" marker-end="url(#04-arrow)"/>
<path d="M600,602 h48 v48 h-48" class="seq-arrow" marker-end="url(#04-arrow)"/>
<text x="664" y="616" text-anchor="start" fill="#edf2f8" font-size="17">5. 마이크 release</text>
<text x="480.0" y="700" text-anchor="middle" fill="#edf2f8" font-size="17">6. 마이크 해제 후 최종</text>
<text x="480.0" y="724" text-anchor="middle" fill="#edf2f8" font-size="17">상태 발행</text>
<line x1="600" y1="738" x2="360" y2="738" class="seq-arrow" marker-end="url(#04-arrow)" stroke-dasharray="6 5"/>
<rect x="26" y="780" width="1148" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="809" text-anchor="middle" fill="#c8d8e8" font-size="17">저장 오류면 Gleo 호출을 취소합니다. 녹음 중이 아니었다면 저장 단계를 건너뜁니다.</text>
<path d="M360,874 h48 v48 h-48" class="seq-arrow" marker-end="url(#04-arrow)"/>
<text x="424" y="888" text-anchor="start" fill="#edf2f8" font-size="17">7. 300ms 대기·화면 활성 상태 재확인</text>
<text x="720.0" y="972" text-anchor="middle" fill="#edf2f8" font-size="17">8. 패키지를 지정한 VOICE_ASSIST 브로드캐스트</text>
<line x1="360" y1="986" x2="1080" y2="986" class="seq-arrow" marker-end="url(#04-arrow)"/>
<text x="240.0" y="1048" text-anchor="middle" fill="#edf2f8" font-size="17">9. Gleo 호출 요청 상태</text>
<text x="240.0" y="1072" text-anchor="middle" fill="#edf2f8" font-size="17">표시</text>
<line x1="360" y1="1086" x2="120" y2="1086" class="seq-arrow" marker-end="url(#04-arrow)" stroke-dasharray="6 5"/>
<rect x="26" y="1128" width="1148" height="54" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="1157" text-anchor="middle" fill="#c8d8e8" font-size="17">화면을 떠나거나 재생성되면 아직 보내지 않은 요청을 취소합니다. Gleo 사용 후 녹음을 자동 재개하지 않습니다.</text>
<rect x="26" y="1212" width="1148" height="78" rx="9" fill="#1d2d3e" stroke="#3c536c"/>
<text x="600.0" y="1241" text-anchor="middle" fill="#c8d8e8" font-size="17">Pleos Connect v2.1.0 / 설치된 Gleo 4.2.0.15에서 확인한 호환 경로입니다. 요청 전송을 음성 응답 성공이나 공개 API 지원</text>
<text x="600.0" y="1265" text-anchor="middle" fill="#c8d8e8" font-size="17">보장으로 표현하지 않습니다.</text>
</svg>